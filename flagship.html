function setLang(lang){if(!copy[lang])lang="ru";const t=copy[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t[el.dataset.t]||""});document.querySelectorAll("[data-lang]").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.lang===lang)));const root=document.getElementById("disciplines");root.replaceChildren();t.items.forEach(item=>{const el=document.createElement("div");el.className="discipline";const glyph=document.createElement("span");glyph.className="glyph";glyph.textContent=item[0];const title=document.createElement("h3");title.textContent=item[1];const desc=document.createElement("p");desc.textContent=item[2];const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent="↗";el.append(glyph,title,desc,arrow);root.append(el)});document.getElementById("formStatus").textContent="";try{localStorage.setItem("brill-language",lang)}catch{}}
document.querySelectorAll("[data-lang]").forEach(el=>el.addEventListener("click",()=>setLang(el.dataset.lang)));
const menu=document.getElementById("menu"),nav=document.getElementById("nav");function closeMenu(){nav.classList.remove("open");menu.setAttribute("aria-expanded","false");menu.textContent="☰"}menu.addEventListener("click",()=>{const open=nav.classList.toggle("open");menu.setAttribute("aria-expanded",String(open));menu.textContent=open?"×":"☰"});nav.querySelectorAll("a").forEach(el=>el.addEventListener("click",closeMenu));document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});document.addEventListener("click",e=>{if(!nav.contains(e.target)&&!menu.contains(e.target))closeMenu()});window.addEventListener("resize",()=>{if(innerWidth>820)closeMenu()});document.getElementById("contactForm").addEventListener("submit",e=>{e.preventDefault();document.getElementById("formStatus").textContent=copy[document.documentElement.lang].notSent});let saved="ru";try{saved=localStorage.getItem("brill-language")||"ru"}catch{}setLang(saved);
