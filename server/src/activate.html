<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>BRILL TEAM — Активация</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#0d0c0e;color:#f8f2e9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top right,#39231f,transparent 55%),#0d0c0e}.card{width:100%;max-width:440px;border:1px solid #423836;background:#181619;border-radius:20px;padding:30px}small{letter-spacing:.16em;color:#d8ad6b}h1{font-size:30px}p{color:#c4bab2;line-height:1.5}label{display:block;margin:20px 0 8px}input{width:100%;padding:14px;border:1px solid #685953;background:#0d0c0e;border-radius:9px;color:#fff;font:inherit}button{margin-top:20px;width:100%;padding:14px;border:0;border-radius:9px;background:#d8ad6b;color:#18120c;font:inherit;font-weight:700}button:disabled{opacity:.6}a{color:#eac38b}#status{min-height:28px}</style></head><body><main class="card"><small>BRILL TEAM / SECURE ACCESS</small><h1>Активация владельца</h1><p>Установите собственный пароль. Ссылка действует один раз и ограничена по времени.</p><form id="form"><label for="pass">Новый пароль (не менее 12 символов)</label><input id="pass" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="repeat">Повторите пароль</label><input id="repeat" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><button id="submit">Активировать доступ</button><p id="status" role="status" aria-live="polite"></p></form><p><a href="/admin">Перейти к входу</a></p></main><script>'use strict';const token=new URLSearchParams(location.hash.slice(1)).get('token');history.replaceState(null,'',location.pathname);const form=document.getElementById('form'),status=document.getElementById('status');if(!token||!/^[A-Za-z0-9_-]{43}$/.test(token)){status.textContent='Ссылка активации отсутствует или недействительна.';form.querySelector('button').disabled=true}form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('pass').value;if(password!==document.getElementById('repeat').value){status.textContent='Пароли не совпадают';return}const btn=document.getElementById('submit');btn.disabled=true;status.textContent='Активация…';try{const r=await fetch('/api/admin/activate',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({token,password})});if(!r.ok)throw Error('Ссылка недействительна, истекла или уже использована.');status.textContent='Доступ активирован. Теперь войдите в панель.';form.reset();form.querySelectorAll('input').forEach(x=>x.disabled=true)}catch(err){status.textContent=err.message;btn.disabled=false}});</script></body></html>
