let newsRequest=0;
async function loadPublishedNews(lang){const id=++newsRequest,root=document.getElementById('publishedNews');if(!root)return;root.replaceChildren();if(!apiBase)return;try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);let response;try{response=await fetch(apiBase+'/api/news?lang='+encodeURIComponent(lang),{signal:controller.signal,cache:'no-store'})}finally{clearTimeout(timer)}if(!response.ok)throw Error('news');const data=await response.json();if(id!==newsRequest||document.documentElement.lang!==lang)return;for(const item of (data.items||[]).slice(0,12)){const article=document.createElement('article'),time=document.createElement('time'),title=document.createElement('h3'),body=document.createElement('p');time.dateTime=item.created_at;time.textContent=new Date(item.created_at).toLocaleDateString(lang==='he'?'he-IL':lang==='en'?'en-US':'ru-RU');title.textContent=item.title;body.textContent=item.body;article.append(time,title,body);root.append(article)}}catch{if(id===newsRequest){const msg=document.createElement('p');msg.className='news-empty';msg.textContent=lang==='he'?'לא ניתן לטעון עדכונים כרגע.':lang==='en'?'Updates are temporarily unavailable.':'Не удалось загрузить новости. Попробуйте позже.';root.append(msg)}}}
let catalogRequest=0;async function loadCatalog(lang){const id=++catalogRequest;for(const [kind,rootId] of [["project","publicProjects"],["service","publicServices"]]){const root=document.getElementById(rootId);root.replaceChildren();if(!apiBase)continue;try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);let response;try{response=await fetch(apiBase+"/api/catalog?kind="+kind+"&lang="+encodeURIComponent(lang),{signal:controller.signal,cache:"no-store"})}finally{clearTimeout(timer)}if(!response.ok)throw Error("catalog");const data=await response.json();if(id!==catalogRequest||document.documentElement.lang!==lang)return;for(const item of (data.items||[]).slice(0,30)){const article=document.createElement("article"),title=document.createElement("h3"),description=document.createElement("p");title.textContent=item.title;description.textContent=item.description;article.append(title,description);root.append(article)}}catch{if(id===catalogRequest){const msg=document.createElement("p");msg.className="news-empty";msg.textContent=lang==="he"?"התוכן אינו זמין כרגע.":lang==="en"?"Content is temporarily unavailable.":"Раздел временно недоступен.";root.append(msg)}}}}
function setLang(lang){if(!copy[lang])lang="ru";const t=copy[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=el.dataset.t==="formNote"&&apiBase?"":t[el.dataset.t]||""});document.querySelectorAll("[data-lang]").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.lang===lang)));const root=document.getElementById("disciplines");root.replaceChildren();t.items.forEach(item=>{const el=document.createElement("div");el.className="discipline";const glyph=document.createElement("span");glyph.className="glyph";glyph.textContent=item[0];const title=document.createElement("h3");title.textContent=item[1];const desc=document.createElement("p");desc.textContent=item[2];const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent="↗";el.append(glyph,title,desc,arrow);root.append(el)});document.getElementById("formStatus").textContent="";loadPublishedNews(lang);loadCatalog(lang);try{localStorage.setItem("brill-language",lang)}catch{}}
document.querySelectorAll("[data-lang]").forEach(el=>el.addEventListener("click",()=>setLang(el.dataset.lang)));
const menu=document.getElementById("menu"),nav=document.getElementById("nav");function closeMenu(){nav.classList.remove("open");menu.setAttribute("aria-expanded","false");menu.textContent="☰";menu.setAttribute("aria-label","Open menu")}menu.addEventListener("click",()=>{const open=nav.classList.toggle("open");menu.setAttribute("aria-expanded",String(open));menu.textContent=open?"×":"☰";menu.setAttribute("aria-label",open?"Close menu":"Open menu")});nav.querySelectorAll("a").forEach(el=>el.addEventListener("click",closeMenu));document.addEventListener("keydown",e=>{if(e.key==="Escape"&&nav.classList.contains("open")){closeMenu();menu.focus()}});document.addEventListener("click",e=>{if(!nav.contains(e.target)&&!menu.contains(e.target))closeMenu()});window.addEventListener("resize",()=>{if(innerWidth>820)closeMenu()});const contactForm=document.getElementById("contactForm"),formStatus=document.getElementById("formStatus");
const configuredApi=document.querySelector('meta[name="brill-api-base"]')?.content.trim()||"";
let apiBase="";
try{if(configuredApi){const u=new URL(configuredApi);if(u.protocol==="https:"&&!u.username&&!u.password&&!u.search&&!u.hash)apiBase=u.origin}}catch{}
let clientAccess=null;const clientChat=document.getElementById("clientChat");function openClientChat(id,token){clientAccess={id,token};location.hash="chat="+id+"."+token;clientChat.hidden=false;document.getElementById("chatBookmark").href=location.href;loadClientChat()}async function clientRequest(method,message){if(!clientAccess||!apiBase)throw Error("Unavailable");const response=await fetch(apiBase+"/api/client/inquiries/"+clientAccess.id+"/chat",{method,headers:{"Content-Type":"application/json","x-brill-chat-token":clientAccess.token},...(message?{body:JSON.stringify({message})}:{})});if(!response.ok)throw Error("Chat request failed");return response.json()}async function loadClientChat(){if(!clientAccess||document.hidden)return;try{const data=await clientRequest("GET"),box=document.getElementById("chatHistory");box.replaceChildren();for(const m of data.items){const div=document.createElement("div");div.style.cssText="padding:12px;border:1px solid #57483b;border-radius:12px;overflow-wrap:anywhere";const strong=document.createElement("strong");strong.textContent=m.sender_kind==="employee"?"BRILL TEAM":"Вы";const p=document.createElement("p");p.textContent=m.message;div.append(strong,p);box.append(div)}document.getElementById("clientChatStatus").textContent=""}catch{document.getElementById("clientChatStatus").textContent="Не удалось загрузить сообщения"}}document.getElementById("clientChatForm").addEventListener("submit",async e=>{e.preventDefault();const button=document.getElementById("clientChatSend"),input=document.getElementById("clientChatInput");button.disabled=true;try{await clientRequest("POST",input.value.trim());input.value="";await loadClientChat()}catch{document.getElementById("clientChatStatus").textContent="Не удалось отправить сообщение"}finally{button.disabled=false}});const clientHash=location.hash.match(/^#chat=([a-f0-9-]{36})\.([A-Za-z0-9_-]{43})$/);if(clientHash)openClientChat(clientHash[1],clientHash[2]);setInterval(()=>{if(clientAccess&&!document.hidden)loadClientChat()},15000);
contactForm.addEventListener("submit",async e=>{
 e.preventDefault();
 const t=copy[document.documentElement.lang]||copy.ru;
 if(!apiBase){formStatus.textContent=t.notSent;return}
 const submit=contactForm.querySelector('button[type="submit"]');
 if(submit.disabled)return;
 submit.disabled=true;formStatus.textContent=t.sending;
 const payload={name:contactForm.elements.name.value.trim(),email:contactForm.elements.email.value.trim(),message:contactForm.elements.message.value.trim(),website:contactForm.elements.website.value};
 try{
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
  let response;
  try{response=await fetch(apiBase+"/api/inquiries",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:controller.signal})}finally{clearTimeout(timeout)}
  if(!response.ok)throw new Error("HTTP "+response.status);
  if(!response.ok)throw new Error("Failed");const receipt=await response.json();if(!receipt.inquiry_id||!receipt.chat_token)throw new Error("Missing chat access");contactForm.reset();formStatus.textContent=t.sent;openClientChat(receipt.inquiry_id,receipt.chat_token)
 }catch{formStatus.textContent=t.sendError}
 finally{submit.disabled=false}
});let saved="ru";try{saved=localStorage.getItem("brill-language")||"ru"}catch{}setLang(saved);
</script></body></html>
