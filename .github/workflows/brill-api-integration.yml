name: BRILL API Neon HTTP integration
on:
  workflow_dispatch:
  push:
    branches: [redesign/flagship-v4]
    paths: ['server/**', '.github/workflows/brill-api-integration.yml']
jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: ${{ secrets.BRILL_TEST_DATABASE_URL }}
      ADMIN_TEST_PASSWORD: ${{ secrets.BRILL_TEST_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required test secrets
        run: |
          test -n "$DATABASE_URL" || { echo "Missing BRILL_TEST_DATABASE_URL"; exit 1; }
          test -n "$ADMIN_TEST_PASSWORD" || { echo "Missing BRILL_TEST_ADMIN_PASSWORD"; exit 1; }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply isolated test schema
        run: |
          node --input-type=module -e 'import {Pool} from "pg";import{readFileSync}from"node:fs";const p=new Pool({connectionString:process.env.DATABASE_URL,ssl:{rejectUnauthorized:true}});try{await p.query(readFileSync("schema.sql","utf8"))}finally{await p.end()}'
      - name: Authentication unit tests
        run: node --test test/auth.test.js
      - name: Neon HTTP end-to-end test
        run: node --test test/http-neon.test.js
